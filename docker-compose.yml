# `docker compose up --build` -> API em http://localhost:8000/docs e app em http://localhost:8501
services:
  api:
    build: .
    image: score-inadimplencia
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
  app:
    image: score-inadimplencia
    depends_on: [api]  # só para a imagem ser construída uma vez; o app não chama a API
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports: ["8501:8501"]
